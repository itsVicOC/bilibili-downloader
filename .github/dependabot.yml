version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      qt-runtime:
        patterns:
          - PySide6
      runtime-dependencies:
        patterns:
          - httpx
          - pydantic
          - qrcode
          - Pillow
          - defusedxml
          - keyring
      test-and-packaging-tools:
        patterns:
          - pytest
          - pytest-qt
          - responses
          - PyInstaller
      ruff:
        patterns:
          - ruff
      build-backend:
        patterns:
          - setuptools
          - wheel
      sbom-tools:
        patterns:
          - cyclonedx-bom
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      official-actions:
        patterns:
          - actions/*
      release-actions:
        patterns:
          - softprops/action-gh-release
