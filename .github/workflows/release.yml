name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  caption:
    if: "!inputs.publish"
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.25', '1.5', '2']
    env:
      PYTHONUTF8: "1"
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Capture Windows compositor and verify caption pixels
        shell: pwsh
        run: |
          foreach ($color in @('star_trail','bilibili_blue')) {
            python -m scripts.capture_docs_screenshots --native --physical-pixels --chrome-only --color-theme $color --output-dir "$env:RUNNER_TEMP/immersive-caption/system/$color"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Capture matching workspace screenshots
        if: matrix.scale == '1'
        run: python .visual_matrix.py --native --physical-pixels --glass-only --output-dir "$env:RUNNER_TEMP/immersive-caption/workspaces"
      - name: Exercise real Windows hit targets and window transitions
        if: matrix.scale == '1'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          python -m pytest -q tests/test_window_chrome.py tests/test_caption_controls.py tests/test_glass_surface.py tests/test_control_details.py tests/test_file_picker.py
          $result = $LASTEXITCODE
          if (Test-Path 'build/ui-parity/chrome-regression') {
            Copy-Item -Recurse 'build/ui-parity/chrome-regression' "$env:RUNNER_TEMP/immersive-caption/input"
          }
          exit $result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: immersive-caption-${{ matrix.scale }}
          path: ${{ runner.temp }}/immersive-caption
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
