name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (tag refs only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_ID: ${{ github.ref_type == 'tag' && github.ref_name || format('dry-run-{0}', github.run_number) }}

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Reject publishing from a branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type != 'tag'
        run: |
          echo "Publishing is only allowed when the workflow is dispatched from a tag." >&2
          exit 1

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact_name: BilibiliDownloader-macOS
            archive_name: BilibiliDownloader-macOS
            ffmpeg_binary: ffmpeg
          - os: windows-latest
            label: Windows
            artifact_name: BilibiliDownloader-Windows
            archive_name: BilibiliDownloader-Windows
            ffmpeg_binary: ffmpeg.exe

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up MSYS2 FFmpeg toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
          pip install -c constraints.txt cyclonedx-bom

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_tag="v$(python -c 'from bilibili_downloader import __version__; print(__version__)')"
          if [ "$GITHUB_REF_NAME" != "$package_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_tag" >&2
            exit 1
          fi

      - name: Run tests
        run: pytest -q

      - name: Build application
        run: pyinstaller --noconfirm --clean BilibiliDownloader.spec

      - name: Verify frozen CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dist/BilibiliDownloader/BilibiliDownloader.exe --help
          else
            dist/BilibiliDownloader/BilibiliDownloader --help
          fi

      - name: Download pinned FFmpeg source
        run: >-
          python scripts/prepare_bundled_ffmpeg.py download-source
          --output ffmpeg-build/FFmpeg-7.1-source.tar.gz

      - name: Build minimal FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          bash scripts/build_bundled_ffmpeg.sh
          ffmpeg-build/FFmpeg-7.1-source.tar.gz
          ffmpeg-build/output

      - name: Build minimal FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          bash scripts/build_bundled_ffmpeg.sh
          ffmpeg-build/FFmpeg-7.1-source.tar.gz
          ffmpeg-build/output

      - name: Generate base dependency SBOM
        run: >-
          cyclonedx-py environment --output-format JSON
          --output-file ffmpeg-build/base.cdx.json

      - name: Prepare FFmpeg notice and variant SBOMs
        shell: bash
        run: |
          python scripts/prepare_bundled_ffmpeg.py prepare \
            --binary "ffmpeg-build/output/${{ matrix.ffmpeg_binary }}" \
            --base-sbom ffmpeg-build/base.cdx.json \
            --lite-sbom "${{ matrix.archive_name }}-lite-${RELEASE_ID}.cdx.json" \
            --full-sbom "${{ matrix.archive_name }}-full-${RELEASE_ID}.cdx.json" \
            --notice ffmpeg-build/output/FFMPEG-NOTICE.txt

      - name: Prepare macOS variants
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/variants/lite dist/variants/full
          ditto dist/BilibiliDownloader.app dist/variants/lite/BilibiliDownloader.app
          ditto dist/BilibiliDownloader.app dist/variants/full/BilibiliDownloader.app
          resources=dist/variants/full/BilibiliDownloader.app/Contents/Resources
          mkdir -p "$resources"
          install -m 755 ffmpeg-build/output/ffmpeg "$resources/ffmpeg"
          install -m 644 ffmpeg-build/output/FFMPEG-NOTICE.txt "$resources/FFMPEG-NOTICE.txt"
          install -m 644 ffmpeg-build/output/COPYING.LGPLv2.1 "$resources/COPYING.LGPLv2.1"
          install -m 644 ffmpeg-build/output/FFMPEG-LICENSE.md "$resources/FFMPEG-LICENSE.md"

      - name: Prepare Windows variants
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/variants/lite", "dist/variants/full" | Out-Null
          Copy-Item -Recurse "dist/BilibiliDownloader" "dist/variants/lite/BilibiliDownloader"
          Copy-Item -Recurse "dist/BilibiliDownloader" "dist/variants/full/BilibiliDownloader"
          $resources = "dist/variants/full/BilibiliDownloader"
          Copy-Item "ffmpeg-build/output/ffmpeg.exe" "$resources/ffmpeg.exe"
          Copy-Item "ffmpeg-build/output/FFMPEG-NOTICE.txt" "$resources/FFMPEG-NOTICE.txt"
          Copy-Item "ffmpeg-build/output/COPYING.LGPLv2.1" "$resources/COPYING.LGPLv2.1"
          Copy-Item "ffmpeg-build/output/FFMPEG-LICENSE.md" "$resources/FFMPEG-LICENSE.md"

      - name: Sign and notarize macOS variants
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "macOS signing secrets are not configured; applying ad-hoc signatures."
            for variant in lite full; do
              app_path="dist/variants/$variant/BilibiliDownloader.app"
              codesign --force --deep --sign - "$app_path"
              codesign --verify --deep --strict --verbose=2 "$app_path"
            done
            exit 0
          fi
          cert_path="$RUNNER_TEMP/biliflow-signing.p12"
          keychain_path="$RUNNER_TEMP/biliflow-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f \
              "$cert_path" \
              "$RUNNER_TEMP/BilibiliDownloader-lite-notarize.zip" \
              "$RUNNER_TEMP/BilibiliDownloader-full-notarize.zip"
          }
          trap cleanup EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          for variant in lite full; do
            app_path="dist/variants/$variant/BilibiliDownloader.app"
            notarize_zip="$RUNNER_TEMP/BilibiliDownloader-$variant-notarize.zip"
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "$notarize_zip"
            xcrun notarytool submit "$notarize_zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$app_path"
          done

      - name: Package macOS variants
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for variant in lite full; do
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/variants/$variant/BilibiliDownloader.app" \
              "${{ matrix.archive_name }}-$variant-${RELEASE_ID}.zip"
          done

      - name: Package Windows variants
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($variant in @("lite", "full")) {
            Compress-Archive `
              -Path "dist/variants/$variant/BilibiliDownloader" `
              -DestinationPath "${{ matrix.archive_name }}-$variant-${env:RELEASE_ID}.zip" `
              -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ env.RELEASE_ID }}
          path: |
            ${{ matrix.archive_name }}-lite-${{ env.RELEASE_ID }}.zip
            ${{ matrix.archive_name }}-full-${{ env.RELEASE_ID }}.zip
            ${{ matrix.archive_name }}-lite-${{ env.RELEASE_ID }}.cdx.json
            ${{ matrix.archive_name }}-full-${{ env.RELEASE_ID }}.cdx.json
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and verify release bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: awk '/^## v/{if (found) exit; found=1} found' CHANGELOG.md > release-assets/release-notes.md

      - name: Add pinned FFmpeg source
        run: >-
          python scripts/prepare_bundled_ffmpeg.py download-source
          --output release-assets/FFmpeg-7.1-source.tar.gz

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          shasum -a 256 *.zip *.cdx.json *.tar.gz > SHA256SUMS.txt

      - name: Verify release bundle
        run: python3 scripts/verify_release_bundle.py release-assets --release-id "$RELEASE_ID"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BilibiliDownloader-release-${{ env.RELEASE_ID }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: assemble
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: BilibiliDownloader-release-${{ env.RELEASE_ID }}
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: Bilibili Downloader ${{ github.ref_name }}
          body_path: release-assets/release-notes.md
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: |
            release-assets/*.zip
            release-assets/*.cdx.json
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
