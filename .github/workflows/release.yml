name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  windows-native-visuals:
    if: "!inputs.publish"
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Before and after Qt native rendering
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-Location
          $baseline = "$env:RUNNER_TEMP/biliflow-before"
          $output = "$env:RUNNER_TEMP/biliflow-visuals"
          git worktree add --detach $baseline HEAD~1
          foreach ($version in @('after', 'before')) {
            if ($version -eq 'before') { Set-Location $baseline }
            foreach ($scene in @('glass', 'ui-refresh', 'builtin-backgrounds', 'workflow-polish', 'dialog-placement')) {
              python -m scripts.capture_docs_screenshots --native --physical-pixels "--$scene-only" --output-dir "$output/$version/$scene"
              if ($LASTEXITCODE -ne 0) { throw "$version $scene failed with status $LASTEXITCODE" }
            }
          }
          Set-Location $candidate
          foreach ($scale in @('1', '1.25', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            python -m scripts.capture_docs_screenshots --native --checks-only --output-dir "$output/scales/$scale/checks"
            if ($LASTEXITCODE -ne 0) { throw "Layout checks failed at scale $scale" }
            python -m scripts.capture_docs_screenshots --native --physical-pixels --dialog-placement-only --output-dir "$output/scales/$scale/dialogs"
            if ($LASTEXITCODE -ne 0) { throw "Dialog capture failed at scale $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Native focused regression
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q tests/test_glass_surface.py tests/test_control_details.py tests/test_dialog_placement.py tests/test_task_interactions.py tests/test_workflow_polish.py::test_total_progress_is_independent_of_stages_and_reserved_completion
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: BiliFlow-Windows-native-comparison
          path: ${{ runner.temp }}/biliflow-visuals
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
