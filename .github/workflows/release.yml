name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  compare:
    if: "!inputs.publish"
    strategy:
      fail-fast: false
      matrix:
        kind: [before, after, scales]
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Capture the download queue, settings and dialogs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = "$PWD/.visual_matrix.py"
          $kind = '${{ matrix.kind }}'
          $output = "$env:RUNNER_TEMP/evidence"
          if ($kind -eq 'before') {
            $baseline = "$env:RUNNER_TEMP/biliflow-before"
            git worktree add --detach $baseline HEAD~1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Set-Location $baseline
          }
          if ($kind -eq 'scales') {
            foreach ($scale in @('1', '1.25', '1.5', '2')) {
              $env:QT_SCALE_FACTOR = $scale
              python -m scripts.capture_docs_screenshots --native --physical-pixels --checks-only --output-dir "$output/$scale/downloads"
              if ($LASTEXITCODE -ne 0) { throw "Native scale $scale downloads failed" }
              python $driver --native --physical-pixels --glass-only --output-dir "$output/$scale/workspaces"
              if ($LASTEXITCODE -ne 0) { throw "Native scale $scale workspaces failed" }
            }
            Remove-Item Env:QT_SCALE_FACTOR
          } else {
            python $driver --native --physical-pixels --glass-only --output-dir "$output/matrix"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native focused regression
        if: matrix.kind == 'after'
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -m pytest -q tests/test_glass_surface.py tests/test_control_details.py tests/test_dialog_placement.py tests/test_file_picker.py tests/test_task_interactions.py tests/test_workflow_polish.py::test_total_progress_is_independent_of_stages_and_reserved_completion tests/test_download_management.py::test_resume_uses_confirmed_progress_before_replacing_paused_readout
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: BiliFlow-Windows-${{ matrix.kind }}-matrix
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
