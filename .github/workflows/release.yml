name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Check baseline and candidate frozen Windows GUIs
    if: '!inputs.publish'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install -c constraints.txt Pillow
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 44445618242
          pattern: BilibiliDownloader-Windows-dry-run-*
          merge-multiple: true
          path: win-baseline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: 44445742252
          pattern: BilibiliDownloader-Windows-dry-run-*
          merge-multiple: true
          path: win-candidate
      - run: python scripts/configure_ui_test_display.py
      - run: python scripts/windows-desktop-check.py win-baseline win-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-frozen-desktop
          path: windows-frozen-desktop
          retention-days: 14
